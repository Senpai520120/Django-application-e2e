# Processing of uploaded CSV files in Airflow. Laid over the main file:
#   docker compose -f docker-compose.yml -f docker-compose.airflow.yml up -d --build
# Airflow UI: http://localhost:8081 (admin / admin).
# Results: the upload_groups table in the DuckDB file on the analytics volume.
# Local storage only: with FILE_STORAGE_BACKEND=s3 Airflow sees no files.
# Run history lives inside the container and goes with it; results stay.

services:
  airflow:
    build: ./airflow
    # Scheduler, API server and DAG processor in one container: enough for
    # one machine, not for production.
    command: standalone
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
      # The app triggers runs as "django", which may run DAGs but not change
      # Airflow's settings; people sign in to the UI as "admin".
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin,django:user
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/passwords.json
      FILESTORE_ROOT: /data/filestore
      DUCKDB_PATH: /data/analytics/analytics.duckdb
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      # Dev-only passwords, the same as AIRFLOW_PASSWORD below.
      - ./airflow/passwords.json:/opt/airflow/passwords.json
      # The very volume the app saves uploads to; Airflow only reads it.
      - filestore:/data/filestore:ro
      - analytics:/data/analytics
    ports:
      - "127.0.0.1:8081:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fs http://127.0.0.1:8080/api/v2/monitor/health
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  web:
    environment:
      AIRFLOW_API_URL: http://airflow:8080
      AIRFLOW_USERNAME: django
      AIRFLOW_PASSWORD: django
    depends_on:
      airflow:
        condition: service_healthy

volumes:
  analytics:

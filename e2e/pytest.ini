[pytest]
# Browser tests. Run from the repository root with `pytest e2e`: this file then
# wins over pyproject.toml, so the unit-test settings (pytest-django,
# coverage) do not apply here, and a plain `pytest` never collects these tests.
testpaths = tests
pythonpath = .

# Options added to every run:
#   --base-url     address of the app; page.goto("/files/") goes to <base-url>/files/
#   --tracing, --screenshot, --video
#                  keep a trace, a screenshot and a video only for failed tests,
#                  in test-results/ of the folder you run pytest from
#   -p no:django   the app's pytest-django plugin is not needed against a live server
#
# The browser is Chromium unless you choose others:
#   pytest e2e --browser chromium --browser firefox --browser webkit
addopts =
    -p no:django
    --base-url=http://127.0.0.1:8000
    --tracing=retain-on-failure
    --screenshot=only-on-failure
    --video=retain-on-failure

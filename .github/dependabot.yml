version: 2
updates:
  # Application dependencies and development tools.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-deps:
        patterns: ["*"]

  # Browser tests (pytest + Playwright) keep their own requirements file.
  - package-ecosystem: pip
    directory: "/e2e"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      e2e-deps:
        patterns: ["*"]

  # Without grouping every action arrives as its own PR, and there are six.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns: ["*"]

  # The base image from the Dockerfile.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      docker-images:
        patterns: ["*"]
    # The task sets Python 3.12 and CI tests 3.12 and 3.13: a newer Python in
    # the image would run untested, so only patch updates are proposed.
    ignore:
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  # The Airflow image, with DuckDB added for the upload processing.
  - package-ecosystem: docker
    directory: "/airflow"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      airflow-image:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: "/airflow"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      airflow-deps:
        patterns: ["*"]

  # Images from docker-compose.yml (postgres, localstack) are a separate
  # ecosystem; ecosystem: docker does not see them.
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      compose-images:
        patterns: ["*"]
    # Majors that break the stack and need work by hand, not a bump:
    # postgres 18 wants its volume at /var/lib/postgresql and a pg_upgrade
    # of the data; localstack 2026.x does not start in CI. Minors still come.
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      - dependency-name: "localstack/localstack"
        update-types: ["version-update:semver-major"]
